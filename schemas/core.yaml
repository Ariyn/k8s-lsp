# k8s-lsp schema pack (minimal)
#
# Each document registers an OpenAPIV3 schema for a Kubernetes GVK.
# This is intentionally minimal + permissive (additionalProperties) to avoid noise,
# while enabling useful key/enum completions.
---
group: "apps"
version: "v1"
kind: "Deployment"
openAPIV3Schema:
  type: object
  properties:
    apiVersion: { type: string }
    kind: { type: string }
    metadata:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    spec:
      type: object
      properties:
        replicas: { type: integer }
        selector:
          type: object
          properties:
            matchLabels:
              type: object
              additionalProperties: { type: string }
          additionalProperties: true
        template:
          type: object
          properties:
            metadata:
              type: object
              properties:
                labels:
                  type: object
                  additionalProperties: { type: string }
                annotations:
                  type: object
                  additionalProperties: { type: string }
              additionalProperties: true
            spec:
              type: object
              properties:
                restartPolicy:
                  type: string
                  enum: ["Always"]
                containers:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      image: { type: string }
                      imagePullPolicy:
                        type: string
                        enum: ["Always", "IfNotPresent", "Never"]
                      ports:
                        type: array
                        items:
                          type: object
                          properties:
                            containerPort: { type: integer }
                            protocol:
                              type: string
                              enum: ["TCP", "UDP", "SCTP"]
                          additionalProperties: true
                    additionalProperties: true
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    status:
      type: object
      additionalProperties: true
  additionalProperties: true
