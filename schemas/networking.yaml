                        value: { type: string }
                      additionalProperties: true
                    method: { type: string }
                    headers:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    queryParams:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                  additionalProperties: true
              backendRefs:
                type: array
                items:
                  type: object
                  properties:
                    group: { type: string }
