openAPIV3Schema:
  type: object
  properties:
    apiVersion: { type: string }
    kind: { type: string }
    metadata:
      type: object
      properties:
        name: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    spec:
      type: object
      properties:
        controllerName: { type: string }
        parametersRef:
          type: object
          properties:
            group: { type: string }
            kind: { type: string }
            name: { type: string }
            namespace: { type: string }
          additionalProperties: true
      additionalProperties: true
    status:
      type: object
      additionalProperties: true
  additionalProperties: true

