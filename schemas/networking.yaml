# k8s-lsp schema pack: networking
#
# Networking-related Kubernetes resources (built-ins + Gateway API).
# Intentionally minimal + permissive to prioritize completion and avoid noisy diagnostics.

---
group: "networking.k8s.io"
version: "v1"
kind: "Ingress"
openAPIV3Schema:
  type: object
  properties:
    apiVersion: { type: string }
    kind: { type: string }
    metadata:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    spec:
      type: object
      properties:
        ingressClassName: { type: string }
        defaultBackend:
          type: object
          properties:
            service:
              type: object
              properties:
                name: { type: string }
                port:
                  type: object
                  properties:
                    name: { type: string }
                    number: { type: integer }
                  additionalProperties: true
              additionalProperties: true
          additionalProperties: true
        tls:
          type: array
          items:
            type: object
            properties:
              hosts:
                type: array
                items: { type: string }
              secretName: { type: string }
            additionalProperties: true
        rules:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              http:
                type: object
                properties:
                  paths:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        pathType:
                          type: string
                          enum: ["Exact", "Prefix", "ImplementationSpecific"]
                        backend:
                          type: object
                          properties:
                            service:
                              type: object
                              properties:
                                name: { type: string }
                                port:
                                  type: object
                                  properties:
                                    name: { type: string }
                                    number: { type: integer }
                                  additionalProperties: true
                              additionalProperties: true
                            resource:
                              type: object
                              additionalProperties: true
                          additionalProperties: true
                      additionalProperties: true
                additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    status:
      type: object
      additionalProperties: true
  additionalProperties: true

---
group: "networking.k8s.io"
version: "v1"
kind: "IngressClass"
openAPIV3Schema:
  type: object
  properties:
    apiVersion: { type: string }
    kind: { type: string }
    metadata:
      type: object
      properties:
        name: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    spec:
      type: object
      properties:
        controller: { type: string }
        parameters:
          type: object
          properties:
            apiGroup: { type: string }
            kind: { type: string }
            name: { type: string }
            namespace: { type: string }
            scope:
              type: string
              enum: ["Cluster", "Namespace"]
          additionalProperties: true
      additionalProperties: true
  additionalProperties: true

---
group: "networking.k8s.io"
version: "v1"
kind: "NetworkPolicy"
openAPIV3Schema:
  type: object
  properties:
    apiVersion: { type: string }
    kind: { type: string }
    metadata:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
      additionalProperties: true
    spec:
      type: object
      properties:
        podSelector:
          type: object
          properties:
            matchLabels:
              type: object
              additionalProperties: { type: string }
          additionalProperties: true
        policyTypes:
          type: array
          items:
            type: string
            enum: ["Ingress", "Egress"]
        ingress:
          type: array
          items:
            type: object
            additionalProperties: true
        egress:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
  additionalProperties: true

# Gateway API (often installed as CRDs). Providing minimal schemas here gives
# immediate completion even without downloading CRDs.

---
group: "gateway.networking.k8s.io"
