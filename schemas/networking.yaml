openAPIV3Schema:
  type: object
  properties:
    apiVersion: { type: string }
    kind: { type: string }
    metadata:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    spec:
      type: object
      properties:
        gatewayClassName: { type: string }
        addresses:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              value: { type: string }
            additionalProperties: true
        listeners:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              protocol: { type: string }
              port: { type: integer }
              hostname: { type: string }
              allowedRoutes:
                type: object
                additionalProperties: true
              tls:
                type: object
                additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    status:
      type: object
      additionalProperties: true
  additionalProperties: true

