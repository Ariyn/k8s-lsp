apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: services
spec:
  group: ""
  scope: Namespaced
  names:
    kind: Service
    plural: services
  versions:
    - name: v1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            spec:
              type: object
              properties:
                type:
                  type: string
                  enum: ["ClusterIP", "NodePort", "LoadBalancer", "ExternalName"]
                selector:
                  type: object
                  additionalProperties:
                    type: string
                ports:
                  type: array
                  items:
                    type: object
                    properties:
                      port:
                        type: integer
                      targetPort:
                        x-kubernetes-int-or-string: true
                      protocol:
                        type: string
                        enum: ["TCP", "UDP", "SCTP"]
                      name:
                        type: string
                    additionalProperties: true
              additionalProperties: true
          additionalProperties: false
