apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingresses.networking.k8s.io
spec:
  group: networking.k8s.io
  scope: Namespaced
  names:
    kind: Ingress
    plural: ingresses
  versions:
    - name: v1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            spec:
              type: object
              properties:
                ingressClassName:
                  type: string
                tls:
                  type: array
                  items:
                    type: object
                    properties:
                      hosts:
                        type: array
                        items:
                          type: string
                      secretName:
                        type: string
                    additionalProperties: true
                defaultBackend:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      host:
                        type: string
                      http:
                        type: object
                        properties:
                          paths:
                            type: array
                            items:
                              type: object
                              properties:
                                path:
                                  type: string
                                pathType:
                                  type: string
                                backend:
                                  type: object
                                  properties:
                                    service:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                        port:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                            number:
                                              type: integer
                                          additionalProperties: true
                                      additionalProperties: true
                                    resource:
                                      type: object
                                      x-kubernetes-preserve-unknown-fields: true
                                  additionalProperties: true
                              additionalProperties: true
                        additionalProperties: true
                    additionalProperties: true
              additionalProperties: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
          additionalProperties: false
