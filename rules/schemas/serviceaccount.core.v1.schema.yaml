apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceaccounts
spec:
  group: ""
  scope: Namespaced
  names:
    kind: ServiceAccount
    plural: serviceaccounts
  versions:
    - name: v1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            automountServiceAccountToken:
              type: boolean
            imagePullSecrets:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                additionalProperties: true
            secrets:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                additionalProperties: true
          additionalProperties: false
